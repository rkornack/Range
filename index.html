<title>Range</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Palette chosen by simulating deuteranopia, protanopia and
   tritanopia. Minimum pairwise separation dE 36.0 across all
   four vision types. Every pair passes WCAG AA.
   Colour is never the only signal: each category also carries
   a text label and its own shape marker.
   ============================================================ */
:root{
  color-scheme:light;
  --bg:#F2F5F7; --surf:#FFFFFF; --surf-2:#E9EEF1; --surf-3:#DCE4E8;
  --ink:#111A1F; --ink-2:#37474F; --mute:#566771; --line:#BFCBD2; --line-2:#DDE4E8;

  --sta:#15658C; --sta-soft:#E8F0F4;   /* stability      — circle */
  --str:#806A00; --str-soft:#F2F0E6;   /* strength       — square */
  --pro:#99004F; --pro-soft:#F5E6ED;   /* proprioception — triangle */
  --alm:#4C1300; --alm-soft:#EDE7E6;   /* stop / high symptom */
  --res:#384224; --res-soft:#EBECE9;   /* restorative    — diamond */
  --lim:#806A00; --lim-soft:#F2F0E6;   /* boundary */

  --disp:'Archivo',system-ui,-apple-system,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mn:'Archivo',system-ui,-apple-system,sans-serif;   /* figures + micro-labels */
  --sb:env(safe-area-inset-bottom,0px); --st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;color:var(--ink);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{background:none;border:none;padding:0;cursor:pointer;text-align:left}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.022em;line-height:1.16;color:var(--ink)}
p{margin:0}
:focus-visible{outline:3px solid var(--sta);outline-offset:2px;border-radius:3px}
.mn{font-family:var(--mn);font-variant-numeric:tabular-nums}
[class*="readout"],[class*="tm-n"],[class*="big"],[class*="val"],[class*="lbl"],[class*="pill"],
[class*="purp"],[class*="perm"],[class*="on"],[class*="sportt"],[class*="kicker"],[class*="hd-num"],
[class*="slotn"],[class*="rt"],[class*="wm"],.chip,.opt .on,.nf input,.nf label,.steps li::before{
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1,"lnum" 1}

#app{max-width:620px;margin:0 auto;min-height:100dvh}
.screen{padding:calc(var(--st) + 18px) 14px 136px}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 4px 16px}
.hd h1{font-size:31px}
.kicker{font-family:var(--mn);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.hd-num{font-family:var(--mn);font-size:11.5px;color:var(--mute)}

.pan{background:var(--surf);border:1px solid var(--line-2);border-radius:7px;margin-bottom:11px;overflow:hidden}
.pan-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:13px 15px 0}
.pan-hd h3{font-size:16px}
.pan-b{padding:11px 15px 15px}
.pan-b.tight{padding-top:8px}
.lbl{font-family:var(--mn);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sub{color:var(--ink-2);font-size:13.5px;line-height:1.46}
.rule{height:1px;background:var(--line-2);margin:12px 0}

/* alert — white panel, thick color bar, never color alone */
.dk{background:var(--surf);border:1px solid var(--line-2);border-left:6px solid var(--ink-2);
  border-radius:7px;padding:13px 15px;margin-bottom:11px}
.dk h3{font-size:15.5px;margin-bottom:4px}
.dk p{font-size:13.5px;color:var(--ink-2);line-height:1.46}
.dk.clin{border-left-color:var(--lim)} .dk.clin .flag{color:var(--lim)}
.dk.info{border-left-color:var(--sta)} .dk.info .flag{color:var(--sta)}
.dk .flag{display:inline-flex;align-items:center;gap:6px;font-family:var(--mn);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.dk .flag::before{content:'';width:9px;height:9px;background:currentColor;flex:0 0 auto}

/* range dial */
.dial{display:flex;align-items:center;gap:15px;padding:4px 0 2px}
.dial svg{flex:0 0 auto}
.dial-rd{flex:1;min-width:0}
.dial-rd .big{font-family:var(--disp);font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1}
.dial-rd .cap{font-family:var(--mn);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-top:5px}
.dial-rd .stop{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-family:var(--mn);font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;color:var(--lim);background:var(--lim-soft);
  border:1px solid var(--lim);padding:3px 7px;border-radius:3px;font-weight:600}

.readout{display:flex;align-items:flex-end;gap:3px;font-family:var(--mn);font-weight:600;letter-spacing:-.035em;line-height:.9}
.readout .n{font-size:40px;font-weight:700} .readout .u{font-size:14px;color:var(--mute);padding-bottom:5px;letter-spacing:0}
.readgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-2);border-radius:5px;overflow:hidden;margin:2px 0 4px}
.readgrid>div{background:var(--surf);padding:12px 13px}

.row{display:flex;align-items:center;gap:11px;width:100%;padding:12px 15px;border-top:1px solid var(--line-2)}
.row:first-child{border-top:none}
.row-b{flex:1;min-width:0}
.row h4{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:-.01em}
.row .sub{font-size:12.5px;margin-top:1px}
.row.off{background:var(--surf-2)}
.row.off h4{color:var(--mute)}
.val{font-family:var(--mn);font-size:13px;font-weight:500;flex:0 0 auto}
.chev{color:var(--mute);font-size:17px;flex:0 0 auto}
.thumb{flex:0 0 auto;width:58px;height:46px;border-radius:5px;background:var(--surf-2);overflow:hidden;
  display:grid;place-items:center;border:1px solid var(--line-2)}
.thumb svg,.thumb img{width:100%;height:100%;display:block;object-fit:cover}

/* category markers — color PLUS shape PLUS text */
.purp{font-family:var(--mn);font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:3px 6px;
  border-radius:3px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid transparent}
.purp::before{content:'';width:8px;height:8px;background:currentColor;flex:0 0 auto}
.purp.stability{background:var(--sta-soft);color:var(--sta);border-color:var(--sta)}
.purp.stability::before{border-radius:50%}
.purp.strength{background:var(--str-soft);color:var(--str);border-color:var(--str)}
.purp.strength::before{border-radius:1px}
.purp.proprioception{background:var(--pro-soft);color:var(--pro);border-color:var(--pro)}
.purp.proprioception::before{clip-path:polygon(50% 0,100% 100%,0 100%)}
.purp.restorative{background:var(--res-soft);color:var(--res);border-color:var(--res)}
.purp.restorative::before{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.budget .bar i.restorative{background:var(--res)}
.modebar{display:flex;gap:7px;margin:2px 0 4px}
.modebar button{flex:1;border:1.5px solid var(--line);background:var(--surf);border-radius:6px;padding:11px 8px;text-align:center}
.modebar button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.modebar strong{display:block;font-size:14px;font-weight:700}
.modebar span{display:block;font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:3px}
.modebar button[aria-pressed="true"] span{color:rgba(255,255,255,.75)}
.sportt{font-family:var(--mn);font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;
  border-radius:3px;font-weight:600;background:var(--surf-2);color:var(--ink-2);border:1px solid var(--line);
  display:inline-flex;align-items:center;gap:4px}
.sportt.key{background:var(--sta-soft);color:var(--sta);border-color:var(--sta)}

.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.pill{font-family:var(--mn);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px;
  border-radius:3px;background:var(--surf-2);color:var(--ink-2);border:1px solid var(--line-2)}
.pill.m{background:var(--sta-soft);color:var(--sta);border-color:var(--sta)}
.pill.l{background:var(--lim-soft);color:var(--lim);border-color:var(--lim)}
.pill.a{background:var(--alm-soft);color:var(--alm);border-color:var(--alm)}

.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:0 18px;
  border-radius:6px;font-weight:600;font-size:15px;border:1.5px solid transparent;transition:opacity .12s}
.b:active{opacity:.72}
.b-go{background:var(--sta);color:#fff;border-color:var(--sta)}
.b-pa{background:var(--surf);color:var(--ink);border-color:var(--line)}
.b-dk{background:var(--surf-2);color:var(--ink);border-color:var(--line)}
.b-w{width:100%} .b-s{min-height:42px;font-size:13.5px;padding:0 13px}
.brow{display:flex;gap:8px;margin-top:11px}
.b[disabled]{opacity:.45}

.chips{display:flex;gap:6px;overflow-x:auto;padding:1px 14px 12px;margin:0 -14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:38px;padding:0 13px;border-radius:5px;border:1.5px solid var(--line);
  background:var(--surf);color:var(--ink-2);font-family:var(--mn);font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--sta);color:#fff;border-color:var(--sta)}
.chip[aria-pressed="true"]::after{content:'✓';font-size:12px}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.chipwrap .chip{min-height:44px;padding:0 14px;font-size:13px;text-transform:none;letter-spacing:.01em;font-family:var(--body)}
.chipwrap .chip.sm{min-height:38px;padding:0 12px;font-size:12.5px}

.sug{border-left:5px solid var(--sta);padding:11px 13px;background:var(--sta-soft);border-radius:0 5px 5px 0;margin-bottom:8px}
.sug.hold{border-color:var(--lim);background:var(--lim-soft)}
.sug.back{border-color:var(--alm);background:var(--alm-soft)}
.sug .act{font-family:var(--mn);font-size:13px;font-weight:600;color:var(--sta)}
.sug.hold .act{color:var(--lim)} .sug.back .act{color:var(--alm)}
.sug .nm{font-size:14.5px;font-weight:600;margin-bottom:2px;color:var(--ink)}
.sug .why{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.42}

.steps{counter-reset:st;margin:0 0 13px;padding:0;list-style:none}
.steps li{counter-increment:st;position:relative;padding-left:32px;margin-bottom:9px;font-size:14.5px;line-height:1.44}
.steps li::before{content:counter(st);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:4px;
  background:var(--ink);color:#fff;font-family:var(--mn);font-size:11px;font-weight:600;display:grid;place-items:center}
.blk{background:var(--surf-2);border-radius:5px;padding:11px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.45}
.blk b{font-family:var(--mn);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;display:block;
  margin-bottom:4px;color:var(--mute);font-weight:600}
.blk.do{background:var(--sta-soft);border:1px solid var(--sta)} .blk.do b{color:var(--sta)}
.blk.no{background:var(--alm-soft);border:1px solid var(--alm);color:var(--alm)} .blk.no b{color:var(--alm)}

.frames{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.slot{border:2px dashed var(--line);border-radius:5px;background:var(--surf-2);padding:7px;text-align:center;position:relative;overflow:hidden}
.slot.has{border-style:solid;border-color:var(--line);padding:0;background:var(--ink)}
.slot img{width:100%;height:130px;object-fit:cover;display:block}
.slot svg{width:100%;height:92px;display:block}
.slot .l1{font-family:var(--mn);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);display:block;margin-top:4px}
.slot .l2{font-size:12.5px;font-weight:700;color:var(--sta);display:block;margin-top:2px}
.slot .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.8));
  color:#fff;font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:16px 7px 5px}

.mod{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.tg{flex:0 0 auto;width:50px;height:30px;border-radius:15px;background:var(--surf-3);position:relative;
  transition:background .15s;border:1.5px solid var(--line)}
.tg span{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg[aria-pressed="true"]{background:var(--sta);border-color:var(--sta)}
.tg[aria-pressed="true"] span{transform:translateX(20px)}
.tg.lim[aria-pressed="true"]{background:var(--lim);border-color:var(--lim)}
.perm{font-family:var(--mn);font-size:9px;letter-spacing:.09em;text-transform:uppercase;padding:2px 5px;
  border-radius:3px;margin-left:6px;vertical-align:1px;border:1px solid}
.perm.boundary{background:var(--lim-soft);color:var(--lim);border-color:var(--lim)}
.perm.support{background:var(--surf-2);color:var(--ink-2);border-color:var(--line)}
.perm.challenge{background:var(--sta-soft);color:var(--sta);border-color:var(--sta)}
.perm.accommodation{background:var(--alm-soft);color:var(--alm);border-color:var(--alm)}

.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:11px 12px;border:1.5px solid var(--line);
  background:var(--surf);border-radius:5px;margin-bottom:6px}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink)}
.opt[aria-pressed="true"] .od{color:#E8EDF0}
.on{flex:0 0 auto;width:26px;height:26px;border-radius:4px;background:var(--surf-2);display:grid;place-items:center;
  font-family:var(--mn);font-size:12px;font-weight:600;color:var(--ink)}
.opt[aria-pressed="true"] .on{background:#fff;color:var(--ink)}
.od{font-size:13px;line-height:1.38;color:var(--ink-2)}

.ng{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.nf label{display:block;font-family:var(--mn);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}
.nf input,.nf select{width:100%;height:52px;border:1.5px solid var(--line);border-radius:5px;background:var(--surf);
  padding:0 12px;font-family:var(--mn);font-size:19px;font-weight:500;text-align:center;color:var(--ink);color-scheme:light}
.nf input[type=date]{text-align:left;font-size:16px}
.nf input:focus,.nf select:focus{outline:3px solid var(--sta);outline-offset:-1px}

.note{background:var(--lim-soft);border:1px solid var(--lim);border-radius:5px;padding:11px 12px;font-size:13px;
  line-height:1.44;color:var(--ink);margin-bottom:12px}
.note b{display:block;font-family:var(--mn);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
  margin-bottom:3px;color:var(--lim);font-weight:600}
.note.m{background:var(--sta-soft);border-color:var(--sta)} .note.m b{color:var(--sta)}

.tm{text-align:center;padding:14px 0 4px}
.tm-n{font-family:var(--disp);font-size:58px;font-weight:700;letter-spacing:-.04em;line-height:1}
.tm-l{font-family:var(--mn);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-top:7px}
.tm.rest .tm-n{color:var(--sta)}

.dg{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin:10px 0 6px}
.dc{aspect-ratio:1;border-radius:3px;background:var(--surf-2);border:1px solid var(--line-2)}
.dc.full{background:var(--sta);border-color:var(--sta)}
.dc.part{background:var(--sta-soft);border-color:var(--sta)}
.dc.now{outline:2px solid var(--ink);outline-offset:1px}

.budget{display:flex;align-items:center;gap:9px;margin:9px 0 4px}
.budget .bar{flex:1;height:11px;border-radius:6px;background:var(--surf-2);overflow:hidden;display:flex;border:1px solid var(--line-2)}
.budget .bar i{display:block;height:100%}
.budget .bar i.stability{background:var(--sta)}
.budget .bar i.strength{background:var(--str)}
.budget .bar i.proprioception{background:var(--pro)}

.slotrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line-2)}
.slotrow:first-of-type{border-top:none}
.slotn{width:30px;height:30px;border-radius:5px;background:var(--surf-2);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mn);font-size:11px;font-weight:600;flex:0 0 auto}
.slotn.done{background:var(--sta);border-color:var(--sta);color:#fff}

.sbg{position:fixed;inset:0;background:rgba(17,26,31,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s}
.sbg.open{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg);max-height:94dvh;display:flex;
  flex-direction:column;border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -8px 40px rgba(17,26,31,.24)}
.sh.open{transform:translateY(0)}
.sh-h{padding:9px 15px 13px;border-bottom:1px solid var(--line);position:relative;background:var(--surf);border-radius:16px 16px 0 0}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sh-h h2{font-size:21px;padding-right:44px}
.sh-b{overflow-y:auto;padding:14px 14px calc(30px + var(--sb));-webkit-overflow-scrolling:touch}
.sh-x{position:absolute;right:13px;top:22px;width:34px;height:34px;border-radius:17px;background:var(--surf-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--ink)}
.sh-max{max-width:620px;margin:0 auto}

.tb{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(242,245,247,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:var(--sb)}
.tb-in{max-width:620px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 9px;color:var(--mute)}
.tab[aria-current="page"]{color:var(--sta)}
.tab svg{width:21px;height:21px}
.tab span{font-family:var(--mn);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}

.ob{padding:calc(var(--st) + 30px) 20px calc(126px + var(--sb));max-width:560px;margin:0 auto;min-height:100dvh}
.ob h1{font-size:28px;margin-bottom:9px}
.ob p.lede{font-size:15px;color:var(--ink-2);line-height:1.5;margin-bottom:22px}
.ob-bar{display:flex;gap:4px;margin-bottom:24px}
.ob-bar i{flex:1;height:4px;background:var(--surf-3);border-radius:2px}
.ob-bar i.on{background:var(--sta)}
.ob-nav{position:fixed;left:0;right:0;bottom:0;padding:12px 20px calc(12px + var(--sb));
  background:linear-gradient(transparent,var(--bg) 24%);max-width:560px;margin:0 auto;display:flex;gap:8px}

.empty{text-align:center;padding:34px 20px;color:var(--mute)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:5px}
.foot{font-size:12.5px;line-height:1.5;color:var(--mute);padding:15px 4px 0;border-top:1px solid var(--line-2);margin-top:16px}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--sb));transform:translate(-50%,14px);background:var(--ink);
  color:#fff;padding:12px 17px;border-radius:6px;font-size:14px;font-weight:500;z-index:80;opacity:0;
  pointer-events:none;transition:all .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============================================================
   IDENTITY
   The mark is the range dial: working range solid, a hard stop,
   end range hatched and never entered. Same object as the one
   inside every exercise.
   ============================================================ */
:root{ --chas:#0B1620; --chas-2:#16293A; --chas-line:#4A7186; --chas-text:#F2F7F8; --chas-mute:#9FBAC7; }

#splash{position:fixed;inset:0;z-index:200;background:var(--chas);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;transition:opacity .6s ease,visibility .6s}
#splash.gone{opacity:0;visibility:hidden;pointer-events:none}
#splash .mk{width:190px;height:132px}
#splash .wm{font-family:var(--disp);font-weight:700;font-size:42px;letter-spacing:.15em;color:var(--chas-text);
  margin-top:14px;opacity:0;animation:rise .55s 1.15s ease forwards;text-indent:.16em}
/* four levels, each on its own beat.
   The phrase slides in from the left slanted, then straightens as it settles. */
#splash .tag{margin-top:18px;overflow:hidden;padding:2px 6px}
#splash .tag span{display:inline-block;font-family:var(--disp);font-weight:600;font-size:23px;line-height:1.25;
  color:var(--chas-text);letter-spacing:-.015em;text-align:center;
  opacity:0;transform:translateX(-56px) skewX(-13deg) scale(1.14);
  animation:slantin .8s 1.5s cubic-bezier(.16,1,.3,1) forwards}
@keyframes slantin{
  0%  {opacity:0;transform:translateX(-56px) skewX(-13deg) scale(1.14)}
  38% {opacity:1}
  100%{opacity:1;transform:translateX(0) skewX(0) scale(1)}}
#splash .tag2{font-family:var(--disp);font-weight:600;font-size:16.5px;letter-spacing:.05em;color:#8FB6C8;
  text-align:center;margin-top:12px;opacity:0;animation:rise .55s 2.15s ease forwards}
#splash .tag3{font-family:var(--body);font-weight:400;font-size:13px;line-height:1.5;color:var(--chas-mute);
  max-width:270px;text-align:center;margin-top:20px;padding-top:15px;border-top:1px solid var(--chas-line);
  opacity:0;animation:rise .55s 2.6s ease forwards}
#splash .skip{position:absolute;inset:0}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.sweep{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.05s .15s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tick{opacity:0;animation:pop .34s 1.2s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes pop{from{opacity:0;transform:scaleY(.2)}to{opacity:1;transform:none}}
.hatch{opacity:0;animation:fade .55s 1.42s ease forwards}
.pivot{opacity:0;animation:fade .35s .45s ease forwards}
@keyframes fade{to{opacity:1}}

/* dark header band — depth, and the mark on every screen */
.band{background:var(--chas);color:var(--chas-text);padding:calc(var(--st) + 14px) 16px 15px;
  border-radius:0 0 18px 18px;margin:0 0 -8px}
.band-top{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.band-top svg{width:30px;height:21px;flex:0 0 auto}
.band-top .wm{font-family:var(--disp);font-weight:800;font-size:14.5px;letter-spacing:.15em;text-indent:.15em}
.band-top .rt{margin-left:auto;font-family:var(--mn);font-size:10.5px;color:var(--chas-mute);letter-spacing:.05em}
.band h1{font-size:30px;color:var(--chas-text);letter-spacing:-.035em;font-weight:700}
.band .kicker{color:var(--chas-mute)}
.band .kicker::before{background:var(--chas-line)}
.band-hero{display:flex;align-items:center;gap:15px;margin-top:15px;padding-top:15px;border-top:1px solid var(--chas-line)}
.band-hero svg{flex:0 0 auto}
.band-hero .rd{flex:1;min-width:0}
.band-hero .big{font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.05}
.band-hero .cap{font-size:12.5px;color:var(--chas-mute);margin-top:5px;line-height:1.42}

.screen{padding-top:10px}
.pan{animation:panin .32s ease both}
@keyframes panin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.pan:nth-of-type(2){animation-delay:.04s} .pan:nth-of-type(3){animation-delay:.08s}
.pan:nth-of-type(4){animation-delay:.12s} .pan:nth-of-type(n+5){animation-delay:.16s}
@media (prefers-reduced-motion:reduce){
  .pan,#splash .wm,#splash .tag span,#splash .tag2,#splash .tag3,.sweep,.tick,.hatch,.pivot{animation:none!important;opacity:1!important;
    stroke-dashoffset:0!important;transform:none!important}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (prefers-contrast:more){:root{--line:#5A6B74;--line-2:#8A99A1;--mute:#37474F}}
</style>
</head>
<body>
<!-- ============================================================
     TAGLINE — one line, change it here.
     Line 1 (.tag)   Master your motion
     Line 2 (.tag2)  Strength for the long run
     Line 3 (.tag3)  Smart movement & training for hypermobile bodies.
     Either can be edited or deleted independently.
     ============================================================ -->
<div id="splash">
  <svg class="mk" viewBox="0 0 190 132" aria-label="Range">
    <g fill="none" stroke-linecap="butt">
      <g class="hatch"><path d="M121.6 45.1 A72.0 72.0 0 0 1 125.5 46.8" stroke="#BE9E3C" stroke-width="13"/><path d="M129.2 48.7 A72.0 72.0 0 0 1 132.8 50.7" stroke="#BE9E3C" stroke-width="13"/><path d="M136.3 53.0 A72.0 72.0 0 0 1 139.7 55.5" stroke="#BE9E3C" stroke-width="13"/><path d="M142.9 58.2 A72.0 72.0 0 0 1 145.9 61.1" stroke="#BE9E3C" stroke-width="13"/><path d="M148.8 64.2 A72.0 72.0 0 0 1 151.5 67.4" stroke="#BE9E3C" stroke-width="13"/><path d="M154.0 70.7 A72.0 72.0 0 0 1 156.3 74.2" stroke="#BE9E3C" stroke-width="13"/><path d="M158.4 77.8 A72.0 72.0 0 0 1 160.3 81.6" stroke="#BE9E3C" stroke-width="13"/><path d="M161.9 85.4 A72.0 72.0 0 0 1 163.3 89.4" stroke="#BE9E3C" stroke-width="13"/></g>
      <path class="sweep" style="--len:119" d="M25.8 92.2 A72.0 72.0 0 0 1 120.5 44.7" stroke="#2E8CBA" stroke-width="19"/>
      <line class="tick" x1="115.9" y1="56.8" x2="125.1" y2="32.5" stroke="#F2F5EF" stroke-width="8" stroke-linecap="round" style="transform-origin:120.5px 44.7px"/>
      <circle class="pivot" cx="95" cy="112" r="7" fill="#F2F5EF" stroke="none"/>
    </g>
  </svg>
  <div class="wm">RANGE</div>
  <div class="tag" id="tagline"><span>Master your motion</span></div>
  <div class="tag2" id="tagline2">Strength for the long run</div>
  <div class="tag3" id="tagline3">Smart movement &amp; training for hypermobile bodies.</div>
  <button class="skip" id="skip" aria-label="Continue"></button>
</div>
<div id="app"><div id="screen" class="screen"></div><nav class="tb" id="tbwrap"><div class="tb-in" id="tabbar"></div></nav></div>

/* ============================================================
   FIGURES — pictograms drawn from joint coordinates.
   viewBox 200x150, floor at y=136.
   near limbs solid, far limbs lighter, so side views read correctly.
   ============================================================ */
const FG={ink:'#0D1519', far:'#93A4AB', prop:'#B9AF9A', acc:'#0F5A66', lim:'#7A4A00'};
function plyn(pts,c,w){ return `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="${w||7}" stroke-linecap="round" stroke-linejoin="round"/>`; }
function pose(o){
  const P=[];
  (o.props||[]).forEach(s=>P.push(s));
  (o.far||[]).forEach(seg=>P.push(plyn(seg,FG.far,6)));
  if(o.spine) P.push(plyn(o.spine,FG.ink,9));
  (o.near||[]).forEach(seg=>P.push(plyn(seg,FG.ink,7)));
  (o.acc||[]).forEach(seg=>P.push(plyn(seg,FG.acc,5)));
  if(o.head) P.push(`<circle cx="${o.head[0]}" cy="${o.head[1]}" r="${o.head[2]||12}" fill="${FG.ink}"/>`);
  (o.dots||[]).forEach(d=>P.push(`<circle cx="${d[0]}" cy="${d[1]}" r="${d[2]||5}" fill="${d[3]||FG.lim}"/>`));
  if(o.arr) P.push(arrow(o.arr[0],o.arr[1],o.arr[2],o.arr[3]));
  return `<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg" role="img">${P.join('')}</svg>`;
}
function arrow(x1,y1,x2,y2){
  const a=Math.atan2(y2-y1,x2-x1), h=7;
  const p1=[x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5)], p2=[x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5)];
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${FG.acc}" stroke-width="3.2" stroke-linecap="round"/>
    <polygon points="${x2},${y2} ${p1.join(',')} ${p2.join(',')}" fill="${FG.acc}"/>`;
}
const FLOOR=`<line x1="8" y1="136" x2="192" y2="136" stroke="${FG.prop}" stroke-width="4" stroke-linecap="round"/>`;
const wallAt=x=>`<line x1="${x}" y1="10" x2="${x}" y2="136" stroke="${FG.prop}" stroke-width="4" stroke-linecap="round"/>`;
const chairAt=(x,y)=>`<path d="M${x} ${y} h42 M${x+42} ${y} v-40 M${x} ${y} v${136-y} M${x+42} ${y} v${136-y}" fill="none" stroke="${FG.prop}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
const boxAt=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="none" stroke="${FG.prop}" stroke-width="4" rx="2"/>`;
const tableAt=y=>`<path d="M30 ${y} h140 M46 ${y} v${136-y} M154 ${y} v${136-y}" fill="none" stroke="${FG.prop}" stroke-width="4" stroke-linecap="round"/>`;
const bandLn=(x1,y1,x2,y2)=>`<path d="M${x1} ${y1} Q${(x1+x2)/2} ${(y1+y2)/2-9} ${x2} ${y2}" fill="none" stroke="${FG.lim}" stroke-width="4" stroke-linecap="round" stroke-dasharray="9 5"/>`;
const ballAt=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r||9}" fill="none" stroke="${FG.lim}" stroke-width="4"/>`;

   PHASE 3 — sport work, behind prerequisite gates

 spine:{label:'Trunk cleared', clinical:true,
   note:'Held while any trunk or spine restriction is active. Your clinician clears this, not the app.'},

   note:'The foot has to hold its own shape before it can absorb a landing.'},

   note:'One leg must control a slow descent before both legs can absorb a fast one.'},
 land2:{label:'Two-foot landing control', reqs:[['drop_land',8]],
   note:'Landing quietly and holding the position, from a step height.'},
 plyo:{label:'Low plyometrics', reqs:[['pogo',20]],
   note:'Small, springy, repeatable ankle work before anything with height.'},
 land1:{label:'One-foot landing control', reqs:[['lat_bound',6]],
   note:'Landing on one leg and stopping dead, without the knee traveling inward.'},
 lathip:{label:'Lateral hip control', reqs:[['clamshell',15],['hip_abd_side',12],['hip_abd_stand',12]],
   note:'Sideways loading — shuffling, edging, traversing — all runs through the side of the hip.'},
 scap:{label:'Scapular control', reqs:[['scap_set',8],['scap_pushup',12]],
   note:'The shoulder blade has to hold position before the arm loads over it.'},
 shmid:{label:'Mid-range shoulder strength', reqs:[['er_iso',8],['band_row',12]],
   note:'Strength where the shoulder is stable, before strength where it is not.'},
 overhead:{label:'Overhead control', reqs:[['wall_slide',8],['band_pulldown',12]],
   note:'Getting overhead with the ribs down and no shrug.'},
 elbow:{label:'Elbow control', reqs:[['elbow_iso',8],['band_pullapart',15]],
   note:'A hypermobile elbow snapping straight at speed is how the swing causes damage.'}
};
/* a gate clears when each required exercise has 3+ sessions at or above
   its target, all with control 4 or better and joint symptom 2 or lower */
function gateProgress(id){
  const g=GATES[id];
  if(g.clinical){
    const held=S.restrictions.some(r=>!r.cleared&&r.scope==='trunk');
    return {id,label:g.label,note:g.note,clinical:true,met:!held,parts:[],
      detail:held?'A trunk restriction is active':'No trunk restriction active'};
  }
  const parts=g.reqs.map(([ex,target])=>{
    const good=sessionsOf(ex).filter(l=>l.control>=4&&l.symptom<=2&&(l.reps||0)>=target);
    return {ex, name:(exById(ex)||{}).name||ex, target, have:Math.min(3,good.length), need:3};
  });
  return {id,label:g.label,note:g.note,parts,met:parts.every(p=>p.have>=p.need)};
}
function gateMet(id){ return gateProgress(id).met; }
function gatesFor(ex){ return (ex.requires||[]).map(gateProgress); }
function exLocked(ex){ const gs=gatesFor(ex); return gs.length? !gs.every(g=>g.met) : false; }

const Store = (() => {
  const mem={}; const host=(typeof window!=='undefined'&&window.storage)?window.storage:null;
  let ls=null; try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ls=localStorage;}catch(e){}
  return {
    async get(k){ if(host){try{const r=await host.get(k);return r?r.value:null}catch(e){return null}}
      if(ls){try{return ls.getItem(k)}catch(e){}} return mem[k]??null; },
    async set(k,v){ if(host){try{await host.set(k,v);return true}catch(e){}}
      if(ls){try{ls.setItem(k,v);return true}catch(e){}} mem[k]=v;return true; },
    where(){ return host?'this browser':(ls?'this device':'memory only'); }
  };
})();

/* ------------------------------------------------------------
   Saved state from an older build is merged, not replaced, and
   then brought up to the current shape. Anything the user chose
   before must survive a rename.
   ------------------------------------------------------------ */
function migrate(){
  const p=S.profile=Object.assign({joints:[],spaces:['home'],equip:['none'],increment:2.5,
    goals:[],sports:[],focus:[],comps:[],phase:'start',plan:null}, S.profile||{});

  /* v1 stored a single sport as a display label: sport:'Volleyball' */
  if(!Array.isArray(p.sports)) p.sports=[];
  if(!Array.isArray(p.focus)) p.focus=[];
  if(!Array.isArray(p.comps)) p.comps=[];
  /* sports that were replaced by ones the user actually does */
  const SWAP={tennis:'pickleball',basketball:'skiing',climbing:'hiking'};
  p.sports=p.sports.map(x=>SWAP[x]||x);
  const norm=v=>{ if(!v) return null; const s=String(v).trim().toLowerCase();
    if(SPORTS_DEF[s]) return s;
    const k=Object.keys(SPORTS_DEF).find(x=>SPORTS_DEF[x].label.toLowerCase()===s);
    return k||null; };
  if(p.sport){ const k=norm(p.sport); if(k&&!p.sports.includes(k)) p.sports.push(k); delete p.sport; }
  p.sports=p.sports.map(norm).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);

  /* plan gained per-session lengths */
  if(p.plan){
    if(!Array.isArray(p.plan.slots)||!p.plan.slots.length)
      p.plan.slots=Array(p.plan.perWeek||3).fill(p.plan.minutes||20);
    p.plan.perWeek=p.plan.slots.length;
    if(!p.plan.minutes) p.plan.minutes=p.plan.slots[0];
  }
  /* restrictions gained a side */
  S.restrictions=(S.restrictions||[]).map(r=>Object.assign({side:'both'},r));
  /* containers that later code assumes exist */
  S.logs=S.logs||[]; S.sessions=S.sessions||[]; S.morning=S.morning||[];
  S.baselines=S.baselines||{}; S.modsBy=S.modsBy||{}; S.modLevels=S.modLevels||{}; S.photoKeys=S.photoKeys||[];
  S.settings=Object.assign({timer:false,workSec:40,restSec:45},S.settings||{});
  S.readiness=S.readiness||[];
}

/* ---------- restrictions ---------- */
const TR={none:0,low:1,med:2,high:3};
const SIDE_LABEL={left:'Left side',right:'Right side',both:'Both sides'};

/* A restriction returns one of:
     null            — nothing applies
     {r, full:true}  — hidden from sessions entirely
     {r, side:'left'|'right'} — usable, but on the unaffected side only
   A one-sided restriction should not delete an exercise you can still
   do on the other side. It annotates it instead. */
function blockedBy(ex){
  let partial=null;
  for(const r of S.restrictions){
    if(r.cleared) continue;
    let hit=false;
    if(r.scope==='trunk') hit = TR[ex.trunk] >= TR[r.level];
    else hit = (ex.joints||[]).includes(r.scope);
    if(!hit) continue;
    if(r.side==='both'||r.scope==='trunk') return {r, full:true};
    partial={r, side:(r.side==='left'?'right':'left')};
  }
  return partial;
}
const isBlocked=ex=>{const b=blockedBy(ex); return !!(b&&b.full);};

/* graded supports: which level of a leveled modification is active */
function modLevel(exId, modId){
  const m=MODMAP[modId]; if(!m||!m.levels) return null;
  const k=exId+'|'+modId;
  const v=(S.modLevels||{})[k];
  return (typeof v==='number')?Math.min(v,m.levels.length-1):0;
}
function setModLevel(exId, modId, idx){
  S.modLevels=S.modLevels||{};
  S.modLevels[exId+'|'+modId]=idx; save();
}
function levelLabel(exId, modId){
  const m=MODMAP[modId], i=modLevel(exId,modId);
  return (m&&m.levels&&i!=null)?m.levels[i].label:'';
}
/* a leveled support that is not yet at its hardest level */
function narrowableSupport(exId){
  const act=activeMods(exId);
  for(const id of act){ const m=MODMAP[id];
    if(m&&m.levels&&m.perm==='support'){
      const i=modLevel(exId,id);
      if(i<m.levels.length-1) return {modId:id, from:i, to:i+1, m};
    }}
  return null;
}
function activeMods(id){
  if(S.modsBy[id]) return S.modsBy[id];
  return (exById(id)?.mods||[]).filter(m=>MODMAP[m]&&MODMAP[m].perm==='boundary');
}

/* ============================================================
   PROGRESSION ENGINE
   Ladder, in order: reps or hold time -> tempo -> challenge mod -> load.
   Depth and range are never on the ladder. A boundary locks that axis
   permanently, so the engine cannot reach for it.
   ============================================================ */
function parseDose(d){
  const hold = /(\d+)\s*s\b/.exec(d);
  const reps = /x\s*(\d+)/.exec(d);
  const sets = /^(\d+)\s*x/.exec(d);
  return { sets:sets?+sets[1]:3, kind:hold?'hold':'reps',
           target:hold?+hold[1]:(reps?+reps[1]:10) };
}
function baseline(id){
  const e=exById(id), d=parseDose(e.dose);
  return S.baselines[id] || {load:0, target:d.target, kind:d.kind, sets:d.sets, tempoSlow:false};
}
function setBaseline(id,b){ S.baselines[id]=b; save(); }

/* one record per calendar day: the day's best-controlled set */
/* days you deliberately took easier do not count toward the gate —
   you should not get a progression signal from a reduced day */
function sessionsOf(id){
  const byDay={};
  S.logs.filter(l=>l.exId===id && l.mode!=='reduced' && l.mode!=='restorative').forEach(l=>{
    const cur=byDay[l.date];
    if(!cur||l.control<cur.control||l.symptom>cur.symptom) byDay[l.date]=l;
  });
  return Object.keys(byDay).sort().map(d=>byDay[d]);
}
const CAP={reps:{lo:8,hi:15,step:2}, hold:{lo:15,hi:45,step:5}};

function suggest(id){
  const e=exById(id); if(!e) return null;
  const b=baseline(id), ss=sessionsOf(id);
  const last=ss[ss.length-1], prev=ss[ss.length-2];
  const cap=CAP[b.kind], unit=b.kind==='hold'?'seconds':'reps';
  const mods=activeMods(id);
  /* the tempo rung already covers slow_ecc, so it is not also a challenge candidate */
  const chalOf=x=>MODMAP[x]&&MODMAP[x].perm==='challenge'&&x!=='slow_ecc';
  const hasChallenge=mods.some(chalOf);
  const canChallenge=(e.mods||[]).some(chalOf);
  const inc=S.profile.increment||2.5;

  if(!last) return {k:'start', act:'Set your starting point',
    why:'Log this once and the app will start tracking where it goes.', b};

  const stale=daysAgo(last.date)>10;
  const good=x=>x&&x.control>=4&&x.symptom<=2;

  if(last.symptom>=7||last.control<=1) return {k:'back', act:'Step back one level',
    why:`Last time: control ${last.control}, joint ${last.symptom}. Regress to the easier version, or add a support modification, before loading this again.`, b};
  if(last.control<=2) return {k:'hold', act:'Repeat the same numbers',
    why:`Control was ${last.control} — the position gave way. Repeat exactly what you did until it holds at 4 or better.`, b};
  if(last.symptom>=5) return {k:'hold', act:'Hold, and add a modification',
    why:`Joint symptom was ${last.symptom}. Keep the numbers where they are and try a boundary or support modification before you add anything.`, b};
  if(stale) return {k:'hold', act:`Repeat ${fmtTarget(b)}`,
    why:`${daysAgo(last.date)} days since you last did this. Repeat the last completed numbers rather than progressing.`, b};
  if(!good(last)) return {k:'hold', act:'Hold here',
    why:`Needs control 4 or better and joint 2 or lower. Last time: control ${last.control}, joint ${last.symptom}.`, b};
  if(!good(prev)) return {k:'hold', act:'One more session at these numbers',
    why:'The gate needs two consecutive sessions that both clear it. This was the first.', b};

  /* gate met — climb the ladder */
  if(b.target<cap.hi){ const nt=Math.min(cap.hi, b.target+cap.step);
    return {k:'up', act:`Add ${nt-b.target} ${unit}`, apply:{target:nt},
      why:`Two clean sessions in a row. ${b.target} to ${nt} ${unit}, same load.`, b}; }
  /* narrowing a graded support beats adding more time on a balance task */
  const ns=narrowableSupport(id);
  if(ns) return {k:'up', act:`Narrow the support: ${ns.m.levels[ns.to].label.toLowerCase()}`,
    apply:{target:cap.lo}, narrow:ns,
    why:`${ns.m.levels[ns.to].note} Holding ${cap.lo} ${unit} there is worth more than ${cap.hi} where you are now.`, b};
  if(!b.tempoSlow) return {k:'up', act:'Slow the lowering to 4 counts', apply:{tempoSlow:true, target:cap.lo},
    why:`You are at ${cap.hi} ${unit}. Slowing the lowering raises the demand without adding weight, which is the better trade here.`, b};
  if(canChallenge&&!hasChallenge){
    const cm=(e.mods||[]).find(m=>chalOf(m)&&!mods.includes(m));
    if(cm) return {k:'up', act:`Add: ${MODMAP[cm].name.toLowerCase()}`, apply:{target:cap.lo}, addMod:cm,
      why:`Time and tempo are maxed. A challenge modification is the next rung, before weight.`, b}; }
  return {k:'up', act:`Add ${inc} lb`, apply:{load:b.load+inc, target:cap.lo, tempoSlow:false},
    why:`Everything else is maxed. Add the smallest increment you own and reset to ${cap.lo} ${unit}.`, b};
}
function fmtTarget(b){ return b.kind==='hold' ? `${b.sets} x ${b.target}s` : `${b.sets} x ${b.target}`; }
function fmtLoad(b){ return b.load>0 ? `${b.load} lb` : 'bodyweight'; }
function applySuggestion(id){
  const s=suggest(id); if(!s||!s.apply) return false;
  if(s.addMod){ S.modsBy[id]=[...new Set([...activeMods(id), s.addMod])]; }
  if(s.narrow){ setModLevel(id, s.narrow.modId, s.narrow.to); }
  setBaseline(id, Object.assign({}, s.b, s.apply)); return true;
}
function weekPlan(){
  const seen=[...new Set(S.logs.map(l=>l.exId))];
  return seen.map(id=>({id, s:suggest(id)})).filter(x=>x.s)
    .sort((a,b)=>({back:0,hold:1,up:2,start:3})[a.s.k]-({back:0,hold:1,up:2,start:3})[b.s.k]);
}

function readinessToday(){ return (S.readiness||[]).find(r=>r.date===today())||null; }
/* 0-1 full, 2 reduced, 3+ restorative. Three mild negatives at once —
   low energy, grumbly joints, bad sleep — is a recognizable pre-flare
   day, so the default errs toward the gentler option. You can always
   override upward. */
function scoreToMode(sc){ return sc>=3?'restorative':sc>=2?'reduced':'full'; }
function setReadiness(ans){
  const sc=READY_Q.reduce((a,q)=>{const o=q.opts.find(o=>o[0]===ans[q.id]); return a+(o?o[2]:0);},0);
  const mode=scoreToMode(sc);
  S.readiness=(S.readiness||[]).filter(r=>r.date!==today());
  S.readiness.push({date:today(), ...ans, score:sc, mode, chosen:mode});
  save(); return mode;
}
function setMode(mode){
  const r=readinessToday();
  if(r){ r.chosen=mode; }
  else { S.readiness=(S.readiness||[]); S.readiness.push({date:today(),score:null,mode,chosen:mode}); }
  save();
}
function todayMode(){ const r=readinessToday(); return r?(r.chosen||r.mode):'full'; }

/* restorative sessions are their own pool, built by time only */
function buildRestorative(minutes){
  const pool=EX.filter(e=>e.purpose==='restorative'&&!isBlocked(e)
    &&e.spaces.some(x=>(S.profile.spaces||['home']).includes(x))
    &&e.equip.some(x=>(S.profile.equip||['none']).includes(x)));
  const seed=['constructive_rest','diaphragm_breath'];
  const rest=pool.map(e=>e.id).filter(i=>!seed.includes(i))
    .sort((a,b)=>{const la=S.logs.filter(l=>l.exId===a), lb=S.logs.filter(l=>l.exId===b);
      const sa=la.length?daysAgo(la[la.length-1].date):99, sb=lb.length?daysAgo(lb[lb.length-1].date):99;
      return sb-sa;});
  const pick=[]; let used=0;
  [...seed.filter(i=>pool.some(e=>e.id===i)),...rest].forEach(id=>{
    const m=estMin(id); if(used+m<=minutes+2){ pick.push(id); used+=m; }});
  return {name:'Restorative', ex:pick, mins:used, capped:used<minutes-2};
}

/* ---------- time estimates ---------- */
function estMin(id){
  const b=baseline(id);
  const per = b.kind==='hold' ? b.target+25 : b.target*3+40;
  return Math.max(1, Math.round(b.sets*per/60));
}
const PURPOSES=['stability','strength','proprioception'];
const ALL_PURPOSES=['stability','strength','proprioception','restorative'];

/* ============================================================
   SESSION BUILDER — packs a session into the time you have
   ============================================================ */
function buildSession(minutes, focus){
  const pool=EX.filter(e=>{
    if(e.purpose==='restorative') return false;
    if(isBlocked(e)) return false;
    if(e.sport_of && !userHasSport(e.sport_of)) return false;
    if(exLocked(e)) return false;
    const sp=S.profile.spaces||['home'];
    if(!e.spaces.some(x=>sp.includes(x))) return false;
    const eq=S.profile.equip||['none'];
    if(!e.equip.some(x=>eq.includes(x))) return false;
    const jt=S.profile.joints||[];
    if(jt.length && !e.sport_of && !e.joints.some(j=>jt.includes(j))) return false;
    return true;
  });
  if(!pool.length) return {name:'Session',ex:[],mins:0};
  /* every session carries stability and position-sense work, whatever the focus */
  const mix = focus==='strength' ? {strength:.55,stability:.3,proprioception:.15}
            : focus==='proprioception' ? {proprioception:.5,stability:.35,strength:.15}
            : {stability:.5,strength:.3,proprioception:.2};
  const pick=[]; let used=0;
  const byP=Object.fromEntries(PURPOSES.map(p=>[p,pool.filter(e=>e.purpose===p)]));
  /* rank: longest since last done, then how much it serves the sports you picked */
  const score=e=>{const l=S.logs.filter(x=>x.exId===e.id);
    const stale=l.length?daysAgo(l[l.length-1].date):99;
    /* sport work you have unlocked is the point of unlocking it — rank it
       above generic work of the same purpose, but the purpose mix still
       decides how many minutes each category gets. */
    const bonus = (e.sport_of ? 25 : userSportRel(e.id).rel*6) + focusBonus(e.id) + compBonus(e.id);
    return stale + bonus;};
  PURPOSES.forEach(p=>byP[p].sort((a,b)=>score(b)-score(a)));
  const want=Object.fromEntries(PURPOSES.map(p=>[p,minutes*mix[p]]));
  const spent=Object.fromEntries(PURPOSES.map(p=>[p,0]));
  let guard=0;
  while(used<minutes && guard++<200){
    const p=PURPOSES.filter(x=>byP[x].length).sort((a,b)=>(spent[a]-want[a])-(spent[b]-want[b]))[0];
    if(!p) break;
    const e=byP[p].shift(); const m=estMin(e.id);
    if(used+m>minutes+2) { if(byP[p].length) continue; else break; }
    pick.push(e.id); used+=m; spent[p]+=m;
  }
  return {name:focus==='strength'?'Strength':focus==='proprioception'?'Position sense':'Stability',
          ex:pick, mins:used};
}
function sessionMix(ids){
  const c={stability:0,strength:0,proprioception:0};
  ids.forEach(id=>{const e=exById(id); if(e) c[e.purpose]+=estMin(id);});
  const tot=Object.values(c).reduce((a,b)=>a+b,0)||1;
  return {c,tot,bar:PURPOSES.map(p=>`<i class="${p}" style="width:${(c[p]/tot*100).toFixed(1)}%"></i>`).join('')};
}

/* ---------- weekly slots: different lengths on different days ---------- */
function weekSlots(){
  const p=S.profile.plan; if(!p) return [];
  if(p.slots&&p.slots.length) return p.slots;
  return Array(p.perWeek||3).fill(p.minutes||20);
}
function weekStart(){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setDate(d.getDate()-dow); return d.toISOString().slice(0,10); }
function sessionsThisWeek(){
  const ws=weekStart();
  return S.sessions.filter(s=>s.date>=ws).length;
}
function slotStatus(){
  const slots=weekSlots(), done=sessionsThisWeek();
  return slots.map((m,i)=>({minutes:m, done:i<done}));
}
function planStatus(){
  const p=S.profile.plan; if(!p) return null;
  const wk=[]; for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);wk.push(d.toISOString().slice(0,10));}
  const doneDays=wk.filter(d=>S.logs.some(l=>l.date===d)).length;
  let daysLeft=null, weeksLeft=null;
  if(p.target){ daysLeft=Math.ceil((new Date(p.target+'T12:00')-Date.now())/864e5); weeksLeft=Math.max(0,Math.ceil(daysLeft/7)); }
  const slots=weekSlots();
  return {perWeek:slots.length, minutes:p.minutes, slots, done:sessionsThisWeek(), doneDays,
    weekMinutes:slots.reduce((a,b)=>a+b,0), target:p.target, why:p.why, daysLeft, weeksLeft};
}

function obScreen(){
  const st=OB[ob.step], p=ob.draft;
  let body='';
  if(st.kind==='intro'){
    body=`<div class="dk info"><span class="flag">The whole idea</span>
      <h3>${esc(WHY.headline)}</h3><p>${esc(WHY.short)}</p></div>
      ${WHY.steps.map((x,i)=>`<div class="slotrow">
        <div class="slotn ${i===WHY.steps.length-1?'done':''}">${i+1}</div>
        <div class="row-b"><div class="lbl">${esc(x.n)}</div>
          <h4 style="font-size:14.5px;font-weight:600;margin-top:2px">${esc(x.t)}</h4></div></div>`).join('')}
      <button class="b b-pa b-w b-s" style="margin-top:16px" data-why="1">Read why</button>
      <div class="dk" style="margin-top:14px"><span class="flag">What it is not</span>
        <p>Not a prescription and not a substitute for a clinician who can look at your joints. Take the exercise list to your PT before you add anything new.</p></div>`;
  }
  if(st.kind==='multi'){
    const sel=p[st.key]||[];
    body=`<div class="chipwrap">${st.opts.map(o=>{
      const [v,l]=Array.isArray(o)?o:[o,o];
      return `<button class="chip" data-ob="multi|${st.key}|${v}" aria-pressed="${sel.includes(v)}">${esc(l)}</button>`;}).join('')}</div>`;
  }
  if(st.kind==='restrict'){
    const rs=p.restr||(p.restr={});
    const AREAS=[['trunk','Trunk or spine'],['shoulder','Shoulder'],['neck','Neck'],['elbow','Elbow'],
      ['wrist','Wrist'],['hip','Hip'],['knee','Knee'],['ankle','Ankle'],['foot','Foot']];
    body=`<div class="chipwrap" style="margin-bottom:16px">
      ${AREAS.map(([v,l])=>`<button class="chip" data-ob="rarea|${v}" aria-pressed="${!!rs[v]}">${esc(l)}</button>`).join('')}</div>
      ${Object.keys(rs).length?Object.keys(rs).map(k=>{
        const lab=(AREAS.find(a=>a[0]===k)||[k,k])[1];
        return `<div class="pan"><div class="pan-b">
          <div class="lbl" style="margin-bottom:8px">${esc(lab)} — which side</div>
          <div class="chipwrap">${(k==='trunk'?[['both','Applies to all trunk loading']]:[['left','Left'],['right','Right'],['both','Both']])
            .map(([v,l])=>`<button class="chip sm" data-ob="rside|${k}|${v}" aria-pressed="${rs[k]===v}">${esc(l)}</button>`).join('')}</div>
        </div></div>`;}).join('')
      :`<div class="dk info"><span class="flag">Nothing selected</span>
        <p>That is fine — leave it empty if no clinician has restricted anything. You can add one later in Settings.</p></div>`}`;
  }
  if(st.kind==='incr'){
    body=`<div class="chipwrap" style="margin-bottom:18px">${[1,2.5,5,10].map(n=>
      `<button class="chip" data-ob="incr|${n}" aria-pressed="${p.increment===n}">${n} lb</button>`).join('')}</div>
      <div class="dk info"><p>Most dumbbell sets jump 5 lb at a time, which is often too big a step. Microplates or 2.5 lb adjustable dumbbells are the single most useful thing you can buy for this.</p></div>`;
  }
  if(st.kind==='goal'){
    body=`<div class="chipwrap" style="margin-bottom:16px">${GOALS.map(([v,l])=>
      `<button class="chip" data-ob="goal|${v}" aria-pressed="${(p.goals||[]).includes(v)}">${esc(l)}</button>`).join('')}</div>
      ${(p.goals||[]).includes('sport')?`<div class="lbl" style="margin-bottom:9px">Which sports — pick as many as apply</div>
      <div class="chipwrap">${SPORT_KEYS.map(s=>`<button class="chip" data-ob="sport|${s}" aria-pressed="${(p.sports||[]).includes(s)}">${esc(SPORTS_DEF[s].label)}</button>`).join('')}</div>
      ${(p.sports||[]).length?`<div class="dk info" style="margin-top:16px"><span class="flag">What this changes</span>
        <p>Exercises that serve ${(p.sports||[]).map(s=>SPORTS_DEF[s].label).join(' or ')} get a tag in the library and get picked sooner when a session is built. A star means it trains a direct demand of the sport; a plus means it supports it.</p></div>`:''}`:''}`;
  }
  if(st.kind==='plan'){
    const n=p.perWeek||0;
    if(n && (!p.slots||p.slots.length!==n)) p.slots=Array.from({length:n},(_,i)=>(p.slots&&p.slots[i])||30);
    body=`<div class="lbl" style="margin-bottom:9px">Sessions per week</div>
      <div class="chipwrap" style="margin-bottom:20px">${[2,3,4,5,6,7].map(x=>
        `<button class="chip sm" data-ob="pw|${x}" aria-pressed="${p.perWeek===x}">${x}</button>`).join('')}</div>
      ${n?`<div class="lbl" style="margin-bottom:9px">How long is each one</div>
        <p class="sub" style="margin-bottom:12px">They do not all have to be the same. Two short ones and three long ones is a normal week.</p>
        ${p.slots.map((m,i)=>`<div class="pan"><div class="pan-b" style="padding-bottom:11px">
          <div class="lbl" style="margin-bottom:8px">Session ${i+1}</div>
          <div class="chipwrap">${[10,15,20,30,45,60,75].map(x=>
            `<button class="chip sm" data-ob="slot|${i}|${x}" aria-pressed="${m===x}">${x}</button>`).join('')}</div>
        </div></div>`).join('')}
        <div class="dk info"><span class="flag">Your week</span>
          <h3>${p.slots.reduce((a,b)=>a+b,0)} minutes across ${n} session${n===1?'':'s'}</h3>
          <p>${p.slots.join(' + ')} minutes. Sessions get built to fit each length exactly, and every one carries stability and position-sense work whatever the focus.</p></div>`:''}`;
  }
  if(st.kind==='target'){
    const d=new Date(); d.setDate(d.getDate()+84);
    body=`<div class="nf" style="margin-bottom:16px"><label>Target date</label>
        <input type="date" data-obd="target" value="${p.target||''}" style="font-size:16px"></div>
      <div class="lbl" style="margin-bottom:9px">What for</div>
      <div class="chipwrap">${['Return to my sport','An event','Off a restriction','Just steadier day to day'].map(v=>
        `<button class="chip" data-ob="why|${v}" aria-pressed="${p.why===v}">${esc(v)}</button>`).join('')}</div>
      <div class="dk info" style="margin-top:18px"><span class="flag lbl">Worth knowing</span>
        <p>The app will show weeks remaining and whether you are keeping to your own frequency. It will not compress the plan to hit a date — connective tissue sets that pace, not the calendar.</p></div>`;
  }
  if(st.kind==='phase'){
    body=`<div class="chipwrap">${[
      ['start','I am starting from the beginning'],
      ['some','I have done stability work before'],
      ['strong','I train regularly and want the hypermobility layer']
    ].map(([v,l])=>`<button class="chip" data-ob="phase|${v}" aria-pressed="${p.phase===v}">${esc(l)}</button>`).join('')}</div>
    <div class="dk info" style="margin-top:18px"><p>Either way the library is fully open. Stability and position-sense work never retires — it drops to a smaller weekly dose rather than going away.</p></div>`;
  }
  const canNext = st.kind==='intro' || st.kind==='phase' ? true
    : st.kind==='multi' ? (p[st.key]||[]).length>0
    : st.kind==='restrict' ? true
    : st.kind==='incr' ? !!p.increment
    : st.kind==='goal' ? (p.goals||[]).length>0
    : st.kind==='plan' ? (!!p.perWeek && !!(p.slots&&p.slots.length))
    : st.kind==='target' ? true : true;
  const last = ob.step===OB.length-1;
  return `<div class="ob">
    <div class="ob-bar">${OB.map((_,i)=>`<i class="${i<=ob.step?'on':''}"></i>`).join('')}</div>
    <div class="kicker">Step ${ob.step+1} of ${OB.length}</div>
    <h1>${esc(st.title)}</h1>
    <p class="lede">${esc(st.lede)}</p>
    ${body}
    <div class="ob-nav">
      ${ob.step>0?`<button class="b b-pa" data-ob="back" style="flex:0 0 auto">Back</button>`:''}
      <button class="b ${canNext?'b-go':'b-pa'}" data-ob="next" style="flex:1" ${canNext?'':'disabled'}>${last?'Start using it':'Continue'}</button>
    </div>
  </div>`;
}

function obClick(v){
  const p=ob.draft, parts=v.split('|');
  if(v==='back'){ ob.step=Math.max(0,ob.step-1); render(); return; }
  if(v==='next'){
    if(ob.step<OB.length-1){ ob.step++; render(); return; }
    S.profile={joints:p.joints||[],spaces:p.spaces||['home'],equip:p.equip||['none'],
      increment:p.increment||2.5,goals:p.goals||[],sports:p.sports||[],phase:p.phase||'start',
      plan:{perWeek:p.perWeek||3,slots:p.slots||[20,20,20],minutes:(p.slots&&p.slots[0])||20,
            target:p.target||null,why:p.why||null}};
    const AL={trunk:'Trunk loading',shoulder:'Shoulder',neck:'Neck',elbow:'Elbow',wrist:'Wrist',
      hip:'Hip',knee:'Knee',ankle:'Ankle',foot:'Foot'};
    S.restrictions=Object.keys(p.restr||{}).map(k=>({id:'r_'+k, scope:k, level:'med', side:p.restr[k]||'both',
      label:AL[k]||k, setBy:'clinician', cleared:false,
      note:k==='trunk' ? 'Set while a spinal structure is healing. Only your clinician clears this.'
        : 'Set by your clinician. Only they clear it.'}));
    S.onboarded=true; save(); view='today'; render(); toast('Set up. Nothing here is locked — change it in Settings.');
    return;
  }
  const [k,a,b]=parts;
  if(k==='multi'){ const arr=p[a]||(p[a]=[]); const i=arr.indexOf(b); i>=0?arr.splice(i,1):arr.push(b); }
  if(k==='rarea'){ const rs=p.restr||(p.restr={}); if(rs[a]) delete rs[a]; else rs[a]=(a==='trunk'?'both':'both'); }
  if(k==='rside'){ (p.restr||(p.restr={}))[a]=b; }
  if(k==='incr') p.increment=Number(a);
  if(k==='goal'){ const g=p.goals||(p.goals=[]); const i=g.indexOf(a); i>=0?g.splice(i,1):g.push(a); }
  if(k==='sport'){ const s=p.sports||(p.sports=[]); const i=s.indexOf(a); i>=0?s.splice(i,1):s.push(a); }
  if(k==='phase') p.phase=a;
  if(k==='pw') p.perWeek=Number(a);
  if(k==='slot'){ p.slots=p.slots||[]; p.slots[Number(a)]=Number(b); }
  if(k==='why') p.why=(p.why===a?null:a);
  render();
}

/* ---------- the mark, reused at any size ---------- */
function mark(w){
  const h=Math.round(w*0.70), cx=w/2, cy=h*0.86, R=w*0.38;
  const A0=196, A1=344, STOP=A0+(A1-A0)*0.64;
  const P=(a,r)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const path=(a0,a1,r)=>{const[x0,y0]=P(a0,r),[x1,y1]=P(a1,r);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
  const sw=w*0.10, hat=[]; const n=7, step=(A1-STOP)/n;
  for(let a=STOP+step*0.15; a<A1-0.4; a+=step) hat.push(path(a, Math.min(a+step*0.5,A1), R));
  const [tx1,ty1]=P(STOP,R-sw*0.7), [tx2,ty2]=P(STOP,R+sw*0.7);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" fill="none">
    ${hat.map(d=>`<path d="${d}" stroke="currentColor" stroke-width="${(sw*0.68).toFixed(1)}" opacity=".45"/>`).join('')}
    <path d="${path(A0,STOP,R)}" stroke="currentColor" stroke-width="${sw.toFixed(1)}"/>
    <line x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}"
      stroke="currentColor" stroke-width="${(sw*0.44).toFixed(1)}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${(w*0.037).toFixed(1)}" fill="currentColor"/></svg>`;
}
/* a live gauge: fills to a proportion, stop tick at the boundary */
function gauge(w, frac, col){
  const h=Math.round(w*0.70), cx=w/2, cy=h*0.86, R=w*0.38;
  const A0=196, A1=344, STOP=A0+(A1-A0)*0.64;
  const val=A0+(STOP-A0)*Math.max(0,Math.min(1,frac));
  const P=(a,r)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const path=(a0,a1,r)=>{const[x0,y0]=P(a0,r),[x1,y1]=P(a1,r);
    return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;};
  const sw=w*0.10, hat=[]; const n=7, step=(A1-STOP)/n;
  for(let a=STOP+step*0.15; a<A1-0.4; a+=step) hat.push(path(a, Math.min(a+step*0.5,A1), R));
  const [tx1,ty1]=P(STOP,R-sw*0.7), [tx2,ty2]=P(STOP,R+sw*0.7);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" fill="none">
    ${hat.map(d=>`<path d="${d}" stroke="#BE9E3C" stroke-width="${(sw*0.68).toFixed(1)}" opacity=".5"/>`).join('')}
    <path d="${path(A0,STOP,R)}" stroke="currentColor" stroke-width="${sw.toFixed(1)}" opacity=".22"/>
    ${frac>0?`<path d="${path(A0,val,R)}" stroke="${col||'#4FA8D8'}" stroke-width="${sw.toFixed(1)}"/>`:''}
    <line x1="${tx1.toFixed(1)}" y1="${ty1.toFixed(1)}" x2="${tx2.toFixed(1)}" y2="${ty2.toFixed(1)}"
      stroke="#F2F5EF" stroke-width="${(sw*0.44).toFixed(1)}" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="${(w*0.037).toFixed(1)}" fill="#F2F5EF"/></svg>`;
}
function band(kicker, title, right, hero){
  return `<div class="band">
    <div class="band-top">${mark(30)}<span class="wm">RANGE</span>
      ${right?`<span class="rt">${esc(right)}</span>`:''}</div>
    <div class="kicker">${esc(kicker)}</div>
    <h1>${esc(title)}</h1>
    ${hero||''}
  </div>`;
}

/* ============================================================
   SIGNATURE: the range dial
   A goniometer readout. Working range filled, boundary as a hard
   stop tick, end range hatched and never trained.
   ============================================================ */
function dial(ex, mods, size){
  size=size||96;
  const hasB=mods.some(m=>MODMAP[m]&&MODMAP[m].perm==='boundary');
  let deg = ex.rom==='mid_range'?95 : ex.rom==='full'?135 : 165;
  if(hasB) deg=Math.min(deg,80);
  const R=40, cx=50, cy=52, A0=-170, A1=-10;
  const pol=(a,r)=>[cx+r*Math.cos(a*Math.PI/180), cy+r*Math.sin(a*Math.PI/180)];
  const aEnd=A0+(A1-A0)*(deg/180);
  const arc=(a,b,r,w,col,extra)=>{const[x1,y1]=pol(a,r),[x2,y2]=pol(b,r);
    return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${r} ${r} 0 ${(b-a)>180?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="butt" ${extra||''}/>`;};
  const ticks=[];
  for(let i=0;i<=8;i++){const a=A0+(A1-A0)*i/8;const[x1,y1]=pol(a,R+6),[x2,y2]=pol(a,R+(i%2?9:11));
    ticks.push(`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--line-2)" stroke-width="1"/>`);}
  const[sx,sy]=pol(aEnd,R-9),[ex2,ey2]=pol(aEnd,R+9);
  return `<svg width="${size}" height="${size*0.72}" viewBox="0 0 100 72" aria-hidden="true">
    <defs><pattern id="hx" width="5" height="5" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="var(--lim)" stroke-width="1.6" opacity=".42"/></pattern></defs>
    ${ticks.join('')}
    ${arc(A0,A1,R,9,'url(#hx)')}
    ${arc(A0,A1,R,9,'var(--lim)','opacity=".14"')}
    ${arc(A0,aEnd,R,9,'var(--sta)')}
    <line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex2.toFixed(1)}" y2="${ey2.toFixed(1)}" stroke="${hasB?'var(--lim)':'var(--ink)'}" stroke-width="${hasB?3:2}"/>
    <circle cx="${cx}" cy="${cy}" r="2.4" fill="var(--ink)"/>
  </svg>`;
}
function dialBlock(ex,mods){
  const hasB=mods.some(m=>MODMAP[m]&&MODMAP[m].perm==='boundary');
  const bn=mods.filter(m=>MODMAP[m]&&MODMAP[m].perm==='boundary').map(m=>MODMAP[m].name);
  return `<div class="dial">${dial(ex,mods,112)}
    <div class="dial-rd">
      <div class="big">${ex.rom==='mid_range'?'Mid range':ex.rom==='full'?'Full range':'End range'}</div>
      <div class="cap">Trained range</div>
      ${hasB?`<span class="stop">Stop · ${esc(bn[0])}</span>`:`<span class="cap" style="display:block;margin-top:8px">Hatched arc is end range. Never trained.</span>`}
    </div></div>`;
}

/* ---------- photos ---------- */
const PHOTOS={};
async function loadPhotos(){ for(const k of (S.photoKeys||[])){const v=await Store.get('range.photo.'+k); if(v) PHOTOS[k]=v;} }
function slot(e,w){
  const k=e.id+'.'+w, cap=w==='start'?'Start position':'End position';
  if(PHOTOS[k]) return `<button class="slot has" data-photo="${k}"><img src="${PHOTOS[k]}" alt="${cap}"><span class="cap">${cap} — tap to replace</span></button>`;
  return `<button class="slot" data-photo="${k}">${fig(w==='start'?e.figStart:e.figEnd)}<span class="l1">${cap}</span><span class="l2">Add your photo</span></button>`;
}
function pickPhoto(key){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.style.display='none';
  document.body.appendChild(inp);
  inp.onchange=()=>{const f=inp.files&&inp.files[0]; if(!f){inp.remove();return;}
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();
      img.onload=()=>{const mx=560,sc=Math.min(1,mx/img.width),c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        const data=c.toDataURL('image/jpeg',.6);
        PHOTOS[key]=data; S.photoKeys=[...new Set([...(S.photoKeys||[]),key])];
        Store.set('range.photo.'+key,data); save(); sheetEx(key.split('.')[0]); toast('Photo saved.'); inp.remove();};
      img.src=rd.result;};
    rd.readAsDataURL(f);};
  inp.click();
}
function howto(e){
  const h=HOWTO[e.id]; if(!h) return '';
  return `<div class="lbl" style="margin-bottom:9px">Getting set up</div>
    <ol class="steps">${h.setup.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>
    <div class="blk do"><b>What you do</b>${esc(h.action)}</div>
    <div class="blk"><b>What it should feel like</b>${esc(h.feel)}</div>
    <div class="blk no"><b>Avoid</b>${esc(e.cueAvoid)}</div>`;
}
function pills(e){
  const t=[`<span class="pill m">${e.chain}</span>`,`<span class="pill m">${e.contraction}</span>`,
    `<span class="pill l">${e.rom.replace('_',' ')}</span>`,`<span class="pill">${e.position}</span>`];
  if(e.proprio>=2)t.push(`<span class="pill">position sense ${e.proprio}/3</span>`);
  if(e.balance>=2)t.push(`<span class="pill">balance ${e.balance}/3</span>`);
  if(e.wristExt==='high')t.push(`<span class="pill a">wrist extension</span>`);
  if(e.cervical==='med'||e.cervical==='high')t.push(`<span class="pill a">neck load</span>`);
  if(e.trunk==='med'||e.trunk==='high')t.push(`<span class="pill a">trunk load</span>`);
  if(e.impact!=='none')t.push(`<span class="pill a">impact</span>`);
  return `<div class="pills">${t.join('')}</div>`;
}

  const wk=weekPlan(), ups=wk.filter(x=>x.s.k==='up'), holds=wk.filter(x=>x.s.k==='hold'||x.s.k==='back');

  const done=pl?pl.done:0, per=pl?pl.perWeek:0;
  const frac=per?done/per:0;

function scSport(){

    ${picker}`;
  /* triathlon brings its three component sports along */
  const shown=[...new Set(sports.flatMap(x=>[x,...(SPORT_INCLUDES[x]||[])]))];
  let s=S.settings.sportView;
  if(!s||!shown.includes(s)) s=shown.find(x=>CHAINS[x])||shown[0];

/* ---------- timer ---------- */
let T={on:false,phase:'work',left:0,iv:null,ac:null};
function timerBlock(){
  const m=Math.floor(T.left/60), s=String(T.left%60).padStart(2,'0');
  return `<div class="pan"><div class="pan-b">
    <div class="tm ${T.phase==='rest'?'rest':''}"><div class="tm-n">${T.on?m+':'+s:String(S.settings.workSec).padStart(2,'0')}</div>
      <div class="tm-l">${T.on?(T.phase==='work'?'Working':'Resting'):'Ready'}</div></div>
    <div class="brow"><button class="b b-pa b-s" style="flex:1" data-tm="${T.on?'stop':'work'}">${T.on?'Stop':'Start work'}</button>
      <button class="b b-pa b-s" style="flex:1" data-tm="rest">Rest</button></div></div></div>`;
}
function cue(f,d){ f=f||880; d=d||.14;
  try{ if(!T.ac)T.ac=new (window.AudioContext||window.webkitAudioContext)();
    if(T.ac.state==='suspended')T.ac.resume();
    const o=T.ac.createOscillator(),g=T.ac.createGain(); o.frequency.value=f;o.type='sine';
    o.connect(g);g.connect(T.ac.destination);
    g.gain.setValueAtTime(.0001,T.ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,T.ac.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,T.ac.currentTime+d);
    o.start();o.stop(T.ac.currentTime+d+.02);}catch(e){}
  if(navigator.vibrate)navigator.vibrate(30);
}
function startTimer(p){ clearInterval(T.iv); T.on=true;T.phase=p;
  T.left=p==='work'?S.settings.workSec:S.settings.restSec; cue(p==='work'?880:520);
  T.iv=setInterval(()=>{ T.left--;
    if(T.left===3)cue(660,.09);
    if(T.left<=0){cue(p==='work'?520:880,.22);clearInterval(T.iv); if(p==='work'){startTimer('rest');return;} T.on=false;}
    render();},1000);
  render();
}
function stopTimer(){clearInterval(T.iv);T.on=false;T.left=0;render();}
