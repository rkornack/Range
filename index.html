      <div class="note m"><b>Cue to use</b>${esc(c.cue)}</div>
    </div></div>
    ${pref.length?`<div class="pan"><div class="pan-hd"><h3>Hardest to compensate in</h3><span class="lbl">${pref.length}</span></div>
      <div class="pan-b tight">
      <p class="sub" style="margin-bottom:9px">Supported positions and isometric work, where there is less for the wrong muscle to take over.</p>
      ${pref.map(x=>{const e=exById(x);
        return `<button class="row" data-ex="${x}" style="padding-left:0;padding-right:0">
          <div class="thumb">${fig(e.figEnd)}</div>
          <div class="row-b"><h4>${esc(e.name)}</h4><div class="sub">${e.dose} · ${estMin(x)} min</div></div>
          <span class="chev">›</span></button>`;}).join('')}
      <button class="b b-go b-w b-s" style="margin-top:11px" data-addall="${pref.join(',')}">Add all to today's session</button>
      </div></div>`:''}
    ${c.caution.length?`<div class="pan"><div class="pan-hd"><h3>Easiest to compensate in</h3></div><div class="pan-b tight">
      <p class="sub" style="margin-bottom:9px">Not off limits — these just need the cue actively in mind, and they get picked less often while this is flagged.</p>
      <div class="pills">${c.caution.map(x=>{const e=exById(x);return e?`<span class="pill a">${esc(e.name)}</span>`:'';}).join('')}</div>
    </div></div>`:''}`);
}
function sheetComps(){
  const on=S.profile.comps||[];
  openSheet('Compensation patterns', `
    <p class="sub" style="margin-bottom:14px">The muscle that should work stays quiet and something else takes over. It does not show up in a log — the reps look fine while the wrong thing does them. Flag the ones you recognize and the app changes what it picks, what it cues, and what it warns you about.</p>
    ${COMPS.map(c=>`<div class="pan"><div class="pan-b">
      <div class="slotrow" style="border-top:none;padding-top:0">
        <button class="tg" data-toggcomp="${c.id}" aria-pressed="${on.includes(c.id)}"><span></span></button>
        <button class="row-b" data-comp="${c.id}" style="background:none;padding:0">
          <h4 style="font-size:14.5px;font-weight:600">${esc(c.label)}</h4>
          <div class="sub">${esc(c.means.split('.')[0])}.</div></button>
        <span class="chev">›</span></div>
    </div></div>`).join('')}`);
}


/* ---------- readiness check-in ---------- */
let readyDraft={};
function sheetReady(){
  const done=READY_Q.every(q=>readyDraft[q.id]);
  const sc=READY_Q.reduce((a,q)=>{const o=q.opts.find(o=>o[0]===readyDraft[q.id]); return a+(o?o[2]:0);},0);
  const m=done?scoreToMode(sc):null;
  openSheet('How is today?', `
    ${READY_Q.map(q=>`<div class="pan"><div class="pan-b">
      <div class="lbl" style="margin-bottom:9px">${esc(q.q)}</div>
      <div class="modebar">${q.opts.map(o=>
        `<button data-rq="${q.id}|${o[0]}" aria-pressed="${readyDraft[q.id]===o[0]}"><strong>${esc(o[1])}</strong><span>&nbsp;</span></button>`).join('')}</div>
    </div></div>`).join('')}
    ${done?`<div class="dk info"><span class="flag">Suggested</span><h3>${MODES[m].label}</h3><p>${esc(MODES[m].note)}</p></div>
      <button class="b b-go b-w" data-readysave="1">Use ${MODES[m].label.toLowerCase()}</button>
      <p class="foot">You can pick a different one on the Today screen afterwards. The suggestion is a starting point, not a verdict.</p>`
    :`<p class="foot">Answer all three and it will suggest a version of today.</p>`}`);
}

/* ============================================================
   ROUTER + EVENTS
   ============================================================ */
const TABS=[{id:'today',l:'Today',d:'M4 5h16v15H4z M4 10h16 M9 3v4 M15 3v4'},
 {id:'plan',l:'Week',d:'M4 18l5-6 4 4 6-9 M4 21h16'},
 {id:'sport',l:'Sport',d:'M12 3v18 M5 8l7-5 7 5 M5 8v8l7 5 7-5V8'},
 {id:'library',l:'Library',d:'M5 4h5v16H5z M12 4h3v16h-3z M17 5l3 14'},
 {id:'log',l:'Log',d:'M4 19V6 M4 19h16 M8 15v-5 M12 15V8 M16 15v-3'},
 {id:'you',l:'You',d:'M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-6 8-6s8 2 8 6'}];

function render(){
  if(!S.onboarded){ if(!ob.draft)ob.draft={joints:[],spaces:['home'],equip:['none'],goals:[]};
    $('screen').innerHTML=obScreen(); $('screen').className=''; $('tbwrap').style.display='none'; return; }
  $('tbwrap').style.display=''; $('screen').className='screen';
  const M={today:scToday,plan:scPlan,sport:scSport,library:scLibrary,session:scSession,log:scLog,you:scYou};
  $('screen').innerHTML=(M[view]||scToday)();
  $('tabbar').innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t.id}" aria-current="${(view===t.id||(view==='session'&&t.id==='today'))?'page':'false'}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${t.d}"/></svg>
    <span>${t.l}</span></button>`).join('');
  window.scrollTo(0,0);
}

const PRESETS={p_feet:{name:'Feet and ankles',ex:['short_foot','toe_spread','calf_seated','ankle_evert','sls']},
 p_lower:{name:'Lower body stability',ex:['wall_sit','chair_squat','hip_abd_side','tke','sls','calf_stand']},
 p_upper:{name:'Upper body and hands',ex:['scap_set','er_iso','serratus','wrist_iso','finger_ext','elbow_iso']},
 p_short:{name:'Short day',ex:['short_foot','wall_sit','scap_set','neck_iso']}};

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-ob],[data-tab],[data-go],[data-ex],[data-f],[data-preset],[data-mod],[data-add],[data-log],[data-opt],[data-save],[data-end],[data-tm],[data-restr],[data-tog],[data-rub],[data-morn],[data-exp],[data-reset],[data-photo],[data-demo],[data-apply],[data-base],[data-savebase],[data-redo],[data-mins],[data-build],[data-slot],[data-psport],[data-issue],[data-issuepick],[data-addall],[data-focus],[data-fa],[data-comp],[data-comps],[data-toggcomp],[data-sview],[data-lvl],[data-ready],[data-rq],[data-readysave],[data-mode],[data-restore],[data-why]');
  if(!el) return; const d=el.dataset;

  if(d.ob){ obClick(d.ob); return; }
  if(d.tab){ view=d.tab; closeSheet(); render(); return; }
  if(d.go){ view=d.go; closeSheet(); render(); return; }
  if(d.f){ const [k,v]=d.f.split('|'); filters[k]=v; render(); return; }
  if(d.ex){ sheetEx(d.ex); return; }
  if(d.rub){ sheetRubric(); return; }
  if(d.base){ sheetBaseline(d.base); return; }
  if(d.photo){ pickPhoto(d.photo); return; }
  if(d.demo){ const e=exById(d.demo);
    window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(e.name+' exercise physical therapy demonstration'),'_blank','noopener'); return; }

  if(d.apply){ const e=exById(d.apply);
    if(applySuggestion(d.apply)){ const b=baseline(d.apply);
      toast('Updated to '+fmtTarget(b)+' · '+fmtLoad(b)); sheetOn?sheetEx(d.apply):null; render(); }
    return; }

  if(d.savebase){
    const g=k=>{const n=document.querySelector('[data-bs="'+k+'"]'); return n?Number(n.value)||0:0;};
    const b=baseline(d.savebase);
    setBaseline(d.savebase,Object.assign({},b,{load:g('load'),target:g('target')||b.target,sets:g('sets')||b.sets}));
    const inc=g('inc'); if(inc>0){S.profile.increment=inc;}
    save(); closeSheet(); toast('Starting point saved.'); render(); return; }

  if(d.psport){ const sp=S.profile.sports||(S.profile.sports=[]);
    const i=sp.indexOf(d.psport); i>=0?sp.splice(i,1):sp.push(d.psport);
    save(); render(); toast(i>=0?SPORTS_DEF[d.psport].label+' removed':SPORTS_DEF[d.psport].label+' added'); return; }
  if(d.mins){ S.settings.mins=Number(d.mins); save(); render(); return; }
  if(d.slot){ S.settings.mins=Number(d.slot); save(); render();
    toast('Set to '+d.slot+' minutes — pick a focus below.'); return; }
  if(d.build){ const pl=planStatus();
    const s=buildSession(S.settings.mins||(pl?pl.minutes:20), d.build);
    if(!s.ex.length){ toast('No exercises match your equipment and joints yet — widen them in Settings.'); return; }
    S.active={id:uid(),date:today(),name:s.name,ex:s.ex,done:[]}; save(); view='session'; render(); return; }
  if(d.preset){ const p=PRESETS[d.preset];
    S.active={id:uid(),date:today(),name:p.name,ex:p.ex.filter(i=>{const e=exById(i);return e&&!isBlocked(e);}),done:[]};
    save(); view='session'; render(); return; }

  if(d.mod){ const [ex,mid]=d.mod.split('|'); const cur=activeMods(ex).slice(); const i=cur.indexOf(mid); const m=MODMAP[mid];
    if(i>=0){ if(m.perm==='boundary'&&!confirm('This is a boundary, not scaffolding. It keeps the joint inside its normal range, and removing it is not progression.\n\nRemove it anyway?')) return; cur.splice(i,1); }
    else cur.push(mid);
    S.modsBy[ex]=cur; save(); sheetEx(ex); return; }

  if(d.add){ if(!S.active)S.active={id:uid(),date:today(),name:'Session',ex:[],done:[]};
    if(!S.active.ex.includes(d.add))S.active.ex.push(d.add);
    save(); closeSheet(); view='session'; render(); toast('Added.'); return; }

  if(d.lvl){ const [ex,mid,i]=d.lvl.split('|');
    setModLevel(ex,mid,Number(i)); sheetEx(ex);
    toast(MODMAP[mid].levels[Number(i)].label); return; }
  if(d.why){ whySheet(); return; }
  if(d.ready){ readyDraft={}; sheetReady(); return; }
  if(d.rq){ const [k,v]=d.rq.split('|'); readyDraft[k]=v; sheetReady(); return; }
  if(d.readysave){ setReadiness(readyDraft); closeSheet(); render();
    toast('Today is '+MODES[todayMode()].label.toLowerCase()+'.'); return; }
  if(d.mode){ setMode(d.mode); render(); toast(MODES[d.mode].note.split('.')[0]+'.'); return; }
  if(d.restore){ const s=buildRestorative(Number(d.restore));
    if(!s.ex.length){ toast('No restorative work matches your setup yet.'); return; }
    S.active={id:uid(),date:today(),name:s.name,ex:s.ex,done:[],mode:'restorative'};
    save(); view='session'; render(); return; }
  if(d.sview){ S.settings.sportView=d.sview; save(); render(); return; }
  if(d.comps){ sheetComps(); return; }
  if(d.comp){ sheetComp(d.comp); return; }
  if(d.toggcomp){ const c=S.profile.comps||(S.profile.comps=[]);
    const i=c.indexOf(d.toggcomp); i>=0?c.splice(i,1):c.push(d.toggcomp);
    save(); sheetComps(); render(); return; }
  if(d.focus){ const fo=S.profile.focus||(S.profile.focus=[]);
    const i=fo.indexOf(d.focus); i>=0?fo.splice(i,1):fo.push(d.focus);
    save(); render(); return; }
  if(d.fa){ const [sp,id]=d.fa.split('|'); sheetFocus(sp,id); return; }
  if(d.issue){ sheetIssue(d.issue); return; }
  if(d.issuepick){ const [ex,iss]=d.issuepick.split('|');
    logIssue(ex,iss); sheetRemedy(ex,iss); return; }
  if(d.addall){ const ids=d.addall.split(',').filter(Boolean);
    if(!S.active) S.active={id:uid(),date:today(),name:'Session',ex:[],done:[]};
    let n=0; ids.forEach(i=>{ if(!S.active.ex.includes(i)){S.active.ex.push(i);n++;} });
    save(); closeSheet(); view='session'; render(); toast(n+' added to today'); return; }
  if(d.log){ sheetLog(d.log); return; }
  if(d.opt){ const [g,n]=d.opt.split('|'); draft[g]=Number(n);
    const b=baseline(draft.exId), ss=sessionsOf(draft.exId); renderLog(ss[ss.length-1],b); return; }

  if(d.save){
    if(draft.control==null||draft.symptom==null){ toast('Control and joint symptom are both needed'); return; }
    S.logs.push({id:uid(),date:today(),exId:draft.exId,load:Number(draft.load)||0,reps:Number(draft.reps)||0,
      control:draft.control,symptom:draft.symptom,soreness:draft.soreness??0,joint:draft.joint,
      mods:activeMods(draft.exId),mode:todayMode()});
    const b=baseline(draft.exId);
    if(!S.baselines[draft.exId]) setBaseline(draft.exId,Object.assign({},b,{load:Number(draft.load)||0}));
    if(S.active){ S.active.done=S.active.done||[]; S.active.done.push(draft.exId); }
    save(); closeSheet();
    const sg=suggest(draft.exId);
    toast(draft.symptom>=5?'Logged. Joint at '+draft.symptom+' — holding the load.'
      :(sg&&sg.k==='up')?'Logged. Gate met — see Week.':'Logged.');
    render(); return; }

  if(d.end){ if(S.active){S.sessions.push(Object.assign({},S.active,{status:d.end}));S.active=null;save();}
    stopTimer(); view='today'; render(); toast(d.end==='stop'?'Stopped and recorded.':'Session recorded.'); return; }

  if(d.tm){ d.tm==='stop'?stopTimer():startTimer(d.tm); return; }

  if(d.restr){ const r=S.restrictions.find(x=>x.id===d.restr);
    if(!r.cleared&&!confirm('A restriction is cleared by the person who set it, not by the app.\n\nHas your clinician cleared this?')) return;
    r.cleared=!r.cleared; save(); render(); return; }

  if(d.tog){ S.settings[d.tog]=!S.settings[d.tog]; save(); render(); return; }
  if(d.morn){ S.morning.push({date:today(),dir:d.morn}); save(); toast('Noted.'); return; }
  if(d.redo){ S.onboarded=false; ob={step:0,draft:Object.assign({joints:[],spaces:['home'],equip:['none'],goals:[]},S.profile)}; render(); return; }

  if(d.exp){ const rows=['date,exercise,load_lb,reps_or_sec,control,joint_symptom,joint,muscle_soreness,modifications'];
    S.logs.forEach(l=>{const e=exById(l.exId);
      rows.push([l.date,(e?e.name:l.exId),l.load,l.reps,l.control,l.symptom,l.joint,l.soreness,(l.mods||[]).join(' + ')].join(','));});
    if((S.issues||[]).length){ rows.push(''); rows.push('REPORTED ISSUES'); rows.push('date,exercise,what');
      S.issues.forEach(i=>{const e=exById(i.exId);
        rows.push([i.date,(e?e.name:i.exId),'"'+ISSUEMAP[i.issueId].label+'"'].join(','));});}
    openSheet('Export',`<p class="sub" style="color:var(--mute);margin-bottom:12px">Select all and copy. This is the view to hand your PT — load against symptoms, per joint.</p>
      <textarea style="width:100%;height:330px;font-family:var(--mn);font-size:11.5px;border:1px solid var(--line);border-radius:4px;padding:11px;background:var(--surf);color:var(--ink)">${esc(rows.join('\n'))}</textarea>`);
    return; }

  if(d.reset){ if(!confirm('Erase all logs, sessions and settings? This cannot be undone.')) return;
    S.logs=[];S.sessions=[];S.morning=[];S.baselines={};S.active=null;save();render();toast('Erased.'); return; }
});

document.addEventListener('input',ev=>{ const t=ev.target;
  if(t.dataset.d){ draft[t.dataset.d]=t.value; return; }
  if(t.dataset.num){ S.settings[t.dataset.num]=Math.max(5,Number(t.value)||30); save(); return; } });
document.addEventListener('change',ev=>{ if(ev.target.dataset.d==='joint') draft.joint=ev.target.value; });
$('sh-x').addEventListener('click',closeSheet);
$('sbg').addEventListener('click',closeSheet);

function dismissSplash(){ const s=$('splash'); if(s&&!s.classList.contains('gone')) s.classList.add('gone'); }
load().then(loadPhotos).then(()=>{
  render();
  const sk=$('skip'); if(sk) sk.addEventListener('click',dismissSplash);
  setTimeout(dismissSplash, 4500);
});
</script>
</body>
